# dsh-cf-router — 上游连接自动优选
#
# 本地起一个 HTTP 反向代理（默认 127.0.0.1:8787），转发到 Cloudflare 前置的
# API 上游时：
#   · 只连 IPv4（避开某些系统 IPv6 优先的路由，那条路常绕道海外边缘）
#   · 只连当前探测出来的最优边缘 IP（SNI 仍是原域名）
#   · 复用长连接，后续请求省掉一次 TLS 握手
#   · 连接失败立即降权并重新优选
#
# 接法：把 provider 的 baseURL 指到 http://127.0.0.1:8787
#       （路径原样透传，例如 /v1/chat/completions）
#
# ⚠ 必改：下面的 targets / probePath 是占位值，装之前换成你自己的上游域名。
#
# ⚠ 部分配置有下限（不是静默生效，`GET /__router/status` 的 configEffective
#    会同时给出 configured 与 effective）：
#      firstByteTimeoutMs ≥ 5000ms   cooldownMs ≥ 1000ms
#      probeIntervalMs ≥ 30000ms     healthCheckMs ≥ 5000ms    ewmaMaxMs ≥ 200ms
#    没有上限：长推理可以把 firstByteTimeoutMs 配到几百秒。
#    单位一律毫秒。
- insert:
    - id: dsh-cf-router
      name: dsh-cf-router
      inject: [ tools ]
      config:
        # 要优选的域名，同时是**唯一的授权白名单**（Issue #6）。
        # 留空则代理一律回 400 no_target；不在这里的域名一律 403，包括 x-cf-target 指定的。
        # 精确匹配，不做到后缀/通配；格式非法（含 IP 字面量、带协议/路径）的条目在装载期被剔除，
        # 剔除原因见 GET /__router/status 的 rejectedTargets。
        targets:
          - "api.example.com"
        listenHost: "127.0.0.1"
        listenPort: 8787
        # 探测路径：任何返回响应的路径都算通（200 / 401 / 404 都行），挑最便宜的那个。
        probePath: "/v1/models"
        probeSamples: 3
        probeTimeoutMs: 6000
        probeIntervalMs: 300000
        # 候选池：DNS 常只给 3 个 IP，挑不出真正更快的。开启后从 CF 公开网段抽样补充，
        # 每段抽 discoverPerRange 个。抽多了是噪声，1~2 个/段够做故障兜底。
        discoverEnabled: true
        discoverPerRange: 1
        # 候选池（Issue #11）。DNS 返回数量超过 maxSize 时**实际容量会临时超出**，
        # 绝不为了满足上限丢弃 DNS 兜底。淘汰候选不删 ipStats 的历史。
        candidatePoolMaxSize: 64
        candidatePoolTtlMs: 86400000
        candidateExploreRatio: 0.2
        candidateHistoricalRatio: 0.4
        candidateCurrentRatio: 0.2
        candidateDnsRatio: 0.2
        candidateRefreshMinIntervalMs: 300000
        candidateCoolingRetentionMs: 3600000
        # 两级测速：候选多时先用 TCP 快速筛（L1），只对最快的 l2TopN 个做完整 HTTP 实测（L2）
        l1Concurrency: 20
        l1TimeoutMs: 1200
        l2TopN: 10
        # 只保留落在这些边缘节点的 IP（如 ["HKG"]、"SIN"）；留空 = 不限制，只把 colo 记在状态里
        coloAllow: []
        # 超过这么久没有真实请求就跳过探测轮次（默认 30 分钟，0 = 永不跳过）
        idleSkipMs: 1800000
        healthCheckMs: 30000
        maxSockets: 16
        keepAlive: true
        failThreshold: 2
        cooldownMs: 60000
        ewmaAlpha: 0.3
        # TTFB 分级阈值，不是过滤阈值：超过它的样本仍保留、仍进 EWMA，
        # 只额外计入 samples.*OverCap，由评分层决定是否采信（大 prompt 的 prefill 不是网络质量）。
        # 详见 README「Per-candidate metrics」/「每个候选的指标」。
        ewmaMaxMs: 3000
        firstByteTimeoutMs: 60000
        allowDirectFallback: true
        # SSRF 第三层：是否允许目标解析到私网/回环/链路本地地址。默认 false。
        # 仅在本地开发或受信内网部署时开启；白名单与格式校验仍然生效。
        allowPrivateTargets: false
        # 管理接口（Issue #7）：读用 GET，有副作用的操作用 POST。
        #   GET  /__router/{status,mode}
        #   POST /__router/{mode,probe,reset,reset-mode}
        # 默认不再发送 Access-Control-Allow-Origin（避免任意网页跨站调用管理接口）。
        # 确需跨源浏览器访问时在此填单个来源，例如 "https://example.com"。
        corsAllowOrigin: ""
        # 管理接口鉴权（Issue #8）。修改型端点必须带 Bearer Token。
        # ⚠ 不要把 Token 直接写在这里（会进版本库）。用 adminTokenFile 指向仓库外的文件：
        #     node scripts/generate-admin-token.mjs --write /path/outside/repo/admin.token
        adminTokenFile: ""
        # 只有在文件未被版本控制且你清楚风险时才直接填这里。
        adminToken: ""
        # 只读端点（/status、/mode）默认开放供 DSH 工具与监控使用；要一并保护就设 true。
        adminProtectStatus: false
        # 允许跨源调用管理接口的 Origin 白名单，默认空 = 拒绝任何带 Origin 的跨源请求。
        adminAllowedOrigins: []
        # 限流：窗口内请求数（按来源与读写分桶，狂打写接口不影响读）
        adminRateLimit: 30
        adminRateWindowMs: 60000
        # 逃生舱：未配 Token 时仍允许回环来源修改状态。默认 false（安全默认）。
        allowUnauthenticatedLocalAdmin: false
        # auto   = 优选最快的 IPv4，失败自动切换（默认）
        # direct = 不做优选，按系统 DNS 直连（仍经过本地代理，用于排查优选本身的问题）
        # 运行时可用 cf_router_mode 工具或 GET /__router/mode?value= 切换，选择写入 stateFile 并保留
        routingMode: "auto"
        # 运行时选择的落盘路径，留空则用 $DSH_HOME/cf-router-state.json
        stateFile: ""
        upstreamTimeoutMs: 600000
        verbose: false
